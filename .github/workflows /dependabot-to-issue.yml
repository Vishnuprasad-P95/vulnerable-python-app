name: Dependabot Alerts to Issues

on:
  schedule:
    # Runs every hour to check for new alerts
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run this manually right now

permissions:
  issues: write
  security-events: read

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Create Issues
        uses: github/dependabot-alerts-to-issues@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
